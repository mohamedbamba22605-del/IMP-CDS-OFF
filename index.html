<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1128" />
    
    <!-- Support iOS PWA & Standalone Safe Areas -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Imperium-CDS-editions" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Imperium-CDS-editions — ERP Institutionnel Capital du Savoir. Audace · Innovation · Vision." />
    
    <title>Imperium-CDS-editions</title>
    
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: '#D4AF37',
              dark: '#0A1128',
              card: '#0B192C',
              danger: '#ef4444',
              success: '#10b981',
            },
            fontFamily: {
              serif: ['Cinzel', 'serif'],
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background-color: #0A1128; color: #f1f5f9;
        overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent;
      }
      #root { width: 100%; min-height: 100%; }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #070D1F; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
